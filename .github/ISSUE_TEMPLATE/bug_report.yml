name: Bug report
description: Report a reproducible lazytypr defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include recordings, secrets, private speech, or confidential material."
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Windows 11 x64", "macOS 13+ arm64", "Documentation only"]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and evidence level
      description: Distinguish source/static, simulated, packaged, and live-hardware evidence.
